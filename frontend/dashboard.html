<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessibility Self-Auditing Agent</title>
<style>
  :root {
    --bg: #121110;
    --card: #1c1a17;
    --card-hover: #221f1b;
    --border: #322e28;
    --border-hover: #453f36;
    --ink: #f0ece3;
    --dim: #a39a8a;
    --dim-2: #746c5f;
    --clay: #e08a52;
    --clay-hover: #ec9d68;
    --clay-light: rgba(224, 138, 82, 0.14);
    --clay-text: #f0a978;
    --ok: #6fbf7f;
    --ok-light: rgba(111, 191, 127, 0.12);
    --bad: #e2716f;
    --bad-light: rgba(226, 113, 111, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2.5rem 2rem;
    line-height: 1.55;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 {
    font-size: 1.45rem; font-weight: 600; margin: 0 0 0.3rem;
    background: linear-gradient(90deg, var(--ink), var(--dim));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: var(--dim); font-size: 0.92rem; margin: 0 0 1.75rem; }

  .controls { display: flex; gap: 0.6rem; margin-bottom: 2rem; }
  input[type=text] {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--ink);
    padding: 0.75rem 1rem; border-radius: 10px; font-family: inherit; font-size: 0.92rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  input[type=text]:focus {
    outline: none; border-color: var(--clay); background: var(--card-hover);
  }
  button {
    background: var(--clay); color: #1a1310; border: none; padding: 0.75rem 1.5rem;
    border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 0 rgba(224, 138, 82, 0);
  }
  button:hover:not(:disabled) {
    background: var(--clay-hover); box-shadow: 0 4px 16px rgba(224, 138, 82, 0.25);
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.running {
    background: var(--card); color: var(--dim); border: 1px solid var(--border);
  }

  .summary { display: none; gap: 1rem; margin-bottom: 1.75rem; }
  .metric {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.1rem 1.25rem; text-align: center; transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .metric:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .metric .n { font-size: 2rem; font-weight: 700; }
  .metric .l { font-size: 0.78rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.2rem; }
  .metric.before .n { color: var(--bad); }
  .metric.after .n { color: var(--ok); }

  section { margin-bottom: 2rem; }
  section > h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.9rem; color: var(--ink); }

  .issue-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.15rem 1.3rem; margin-bottom: 0.7rem; display: flex; gap: 1rem; align-items: flex-start;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .issue-card:hover { border-color: var(--border-hover); background: var(--card-hover); transform: translateX(3px); }
  .issue-icon {
    width: 36px; height: 36px; border-radius: 10px; background: var(--clay-light); color: var(--clay-text);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; font-weight: 700;
  }
  .issue-body { flex: 1; }
  .issue-title { font-weight: 600; font-size: 0.98rem; margin-bottom: 0.25rem; color: var(--ink); }
  .issue-plain { font-size: 0.9rem; color: var(--ink); opacity: 0.9; margin-bottom: 0.4rem; }
  .issue-why { font-size: 0.83rem; color: var(--dim); }
  .issue-count {
    font-size: 0.75rem; background: var(--bad-light); color: var(--bad); padding: 0.2rem 0.6rem;
    border-radius: 100px; font-weight: 600; flex-shrink: 0; white-space: nowrap;
  }

  .log-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 0.95rem 1.2rem; margin-bottom: 0.55rem; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .log-item:hover { border-color: var(--border-hover); background: var(--card-hover); }
  .log-plain { font-size: 0.92rem; display: flex; align-items: center; gap: 0.65rem; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(111, 191, 127, 0.5); }
  .status-dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(226, 113, 111, 0.5); }
  .status-dot.info { background: var(--dim-2); }
  .log-reasoning {
    font-size: 0.83rem; color: var(--dim); font-style: italic; margin: 0.45rem 0 0 1.3rem;
  }
  .log-technical {
    font-size: 0.76rem; color: var(--dim); margin: 0 0 0 1.3rem; font-family: "SF Mono", Menlo, monospace;
    background: var(--bg); padding: 0 0.6rem; border-radius: 8px; white-space: pre-wrap;
    max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
  }
  .log-item.expanded .log-technical { max-height: 400px; padding: 0.5rem 0.6rem; opacity: 1; margin-top: 0.45rem; }
  .toggle-tech {
    font-size: 0.76rem; color: var(--clay); cursor: pointer; margin: 0.4rem 0 0 1.3rem; display: inline-flex;
    align-items: center; gap: 0.3rem; user-select: none; transition: color 0.15s ease;
  }
  .toggle-tech:hover { color: var(--clay-hover); }
  .toggle-tech .chev { transition: transform 0.2s ease; display: inline-block; font-size: 0.7rem; }
  .log-item.expanded .toggle-tech .chev { transform: rotate(90deg); }

  .empty { color: var(--dim); font-size: 0.9rem; text-align: center; padding: 2.5rem 0; }
  .error-box {
    background: var(--bad-light); color: var(--bad); border: 1px solid rgba(226, 113, 111, 0.3);
    border-radius: 12px; padding: 0.95rem 1.15rem; font-size: 0.9rem;
  }

  .spinner {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--dim-2); border-top-color: var(--clay);
    animation: spin 0.7s linear infinite; margin-right: 0.5rem; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  section, .summary { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="wrap">

  <h1>Accessibility self-auditing agent</h1>
  <p class="sub">Scans a page for accessibility problems, fixes what it can, then checks its own work.</p>

  <div class="controls">
    <input type="text" id="url" value="http://localhost:8080/index.html">
    <button id="run">Run audit</button>
  </div>

  <div class="summary" id="summary">
    <div class="metric before"><div class="n" id="beforeCount">–</div><div class="l">Issues found</div></div>
    <div class="metric after"><div class="n" id="afterCount">–</div><div class="l">Issues remaining</div></div>
  </div>

  <section id="issuesSection" style="display:none">
    <h2>What was wrong with the page</h2>
    <div id="issuesList"></div>
  </section>

  <section id="logSection" style="display:none">
    <h2>What the agent did about it</h2>
    <div id="logList"></div>
  </section>

  <div class="empty" id="empty">Click "Run audit" to scan the page.</div>

</div>

<script>
const BACKEND = "http://localhost:8000";

const RULE_INFO = {
  "image-alt": {
    title: "An image has no description",
    icon: "🖼",
    plain: "A picture on the page has no written description attached to it.",
    why: "People who use screen readers (software that reads a webpage aloud, often used by people who are blind or have low vision) hear nothing where this image is — they have no idea what it shows.",
  },
  "color-contrast": {
    title: "Text is too hard to read",
    icon: "◐",
    plain: "Some text is too close in color to its background, making it low-contrast.",
    why: "People with low vision, color blindness, or anyone using their phone in bright sunlight can struggle to read text that doesn't stand out clearly from its background.",
  },
  "label": {
    title: "A form field isn't labeled",
    icon: "▭",
    plain: "A box where someone types information (like a name or phone number) has no label telling them what to enter.",
    why: "Sighted users can usually guess from layout, but screen reader users hear only \"edit text\" with no indication of what's being asked for — they can't fill out the form correctly.",
  },
  "aria-input-field-name": {
    title: "A form field isn't labeled",
    icon: "▭",
    plain: "A box where someone types information has no accessible name for assistive technology.",
    why: "Screen reader users hear only \"edit text\" with no indication of what's being asked for — they can't fill out the form correctly.",
  },
};

const STEP_INFO = {
  scan: (s) => ({ text: `Scanned the page — found ${s.violation_count} issue(s).`, status: "info" }),
  fix_applied: (s) => {
    if (s.rule === "color-contrast") {
      return { text: `Fixed low-contrast text by darkening the color (was hard to read, now passes the readability standard).`, status: "ok" };
    }
    if (s.rule === "image-alt") {
      return { text: `Wrote a description for the image so screen readers can announce what it shows.`, status: "ok" };
    }
    return { text: `Added a label to a form field so it's clear what information belongs there.`, status: "ok" };
  },
  fix_failed: (s) => ({ text: `Couldn't fix this one automatically — it needs a person to look at it. (${s.reason || ""})`, status: "bad" }),
  fix_error: (s) => ({ text: `A fix attempt hit a technical error and didn't complete.`, status: "bad" }),
  retry: (s) => ({ text: `First attempt didn't fully fix the issue — trying again with what it learned.`, status: "info" }),
  flagged_for_review: (s) => ({ text: `Tried multiple times but couldn't resolve this automatically — flagged for a person to review.`, status: "bad" }),
  skip: (s) => ({ text: `Found an issue type it doesn't know how to fix yet.`, status: "bad" }),
  warning: (s) => ({ text: `Noted a limitation while working on this fix.`, status: "info" }),
};

document.getElementById("run").addEventListener("click", async () => {
  const btn = document.getElementById("run");
  const empty = document.getElementById("empty");
  btn.disabled = true;
  btn.classList.add("running");
  btn.innerHTML = `<span class="spinner"></span>Running…`;
  empty.textContent = "Scanning and fixing — this can take a little while…";
  empty.style.display = "block";
  document.getElementById("issuesSection").style.display = "none";
  document.getElementById("logSection").style.display = "none";
  document.getElementById("summary").style.display = "none";

  try {
    const res = await fetch(`${BACKEND}/audit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: document.getElementById("url").value }),
    });
    const data = await res.json();
    empty.style.display = "none";
    renderIssues(data.before);
    renderLog(data.steps);
    document.getElementById("summary").style.display = "flex";
    document.getElementById("beforeCount").textContent = data.before.length;
    document.getElementById("afterCount").textContent = data.after.length;
  } catch (e) {
    empty.style.display = "block";
    empty.innerHTML = `<div class="error-box">Couldn't reach the agent. Is the backend running? (${e.message})</div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove("running");
    btn.textContent = "Run audit";
  }
});

function renderIssues(violations) {
  const section = document.getElementById("issuesSection");
  const list = document.getElementById("issuesList");
  list.innerHTML = "";
  if (!violations.length) {
    section.style.display = "none";
    return;
  }
  section.style.display = "block";
  for (const v of violations) {
    const info = RULE_INFO[v.id] || { title: v.id, icon: "!", plain: v.description || "", why: "" };
    const count = v.nodes ? v.nodes.length : 1;
    const card = document.createElement("div");
    card.className = "issue-card";
    card.innerHTML = `
      <div class="issue-icon">${info.icon}</div>
      <div class="issue-body">
        <div class="issue-title">${info.title}</div>
        <div class="issue-plain">${info.plain}</div>
        <div class="issue-why">${info.why}</div>
      </div>
      <div class="issue-count">${count} spot${count > 1 ? "s" : ""}</div>
    `;
    list.appendChild(card);
  }
}

function renderLog(steps) {
  const section = document.getElementById("logSection");
  const list = document.getElementById("logList");
  list.innerHTML = "";
  section.style.display = "block";
  steps.forEach((s, i) => {
    const builder = STEP_INFO[s.type];
    const { text, status } = builder ? builder(s) : { text: s.type, status: "info" };

    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `
      <div class="log-plain"><span class="status-dot ${status}"></span>${text}</div>
      ${s.reasoning ? `<div class="log-reasoning">"${s.reasoning}"</div>` : ""}
      <span class="toggle-tech" data-idx="${i}"><span class="chev">▸</span>Technical details</span>
      <div class="log-technical">${JSON.stringify(s, null, 2)}</div>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll(".toggle-tech").forEach((el) => {
    el.addEventListener("click", () => {
      el.closest(".log-item").classList.toggle("expanded");
    });
  });
}
</script>

</body>
</html>
