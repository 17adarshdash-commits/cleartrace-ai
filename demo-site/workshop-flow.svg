<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#faf6f1"/>
  <g font-family="sans-serif" font-size="14" fill="#2b2420">
    <rect x="20" y="80" width="120" height="60" rx="8" fill="#e9c9b6" stroke="#b5654a"/>
    <text x="80" y="115" text-anchor="middle">Check In</text>

    <rect x="180" y="80" width="120" height="60" rx="8" fill="#e9c9b6" stroke="#b5654a"/>
    <text x="240" y="108" text-anchor="middle">Wheel</text>
    <text x="240" y="126" text-anchor="middle">Demo</text>

    <rect x="340" y="80" width="120" height="60" rx="8" fill="#e9c9b6" stroke="#b5654a"/>
    <text x="400" y="108" text-anchor="middle">Hands-On</text>
    <text x="400" y="126" text-anchor="middle">Throwing</text>

    <rect x="480" y="80" width="100" height="60" rx="8" fill="#e9c9b6" stroke="#b5654a"/>
    <text x="530" y="108" text-anchor="middle">Glaze</text>
    <text x="530" y="126" text-anchor="middle">Pickup</text>
    <text x="530" y="150" text-anchor="middle" font-size="11">(2 weeks later)</text>

    <path d="M140 110 L180 110" stroke="#2b2420" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 110 L340 110" stroke="#2b2420" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M460 110 L480 110" stroke="#2b2420" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b2420"/>
    </marker>
  </defs>
</svg>
